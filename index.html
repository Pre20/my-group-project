<!DOCTYPE html>
<html>
<head>
    <title>Simple Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🛍 Simple Online Shop</h1>

    <h3>Products</h3>

    <button onclick="addToCart('Shoes', 1000)">Shoes - ₹1000</button>
    <button onclick="addToCart('Bag', 500)">Bag - ₹500</button>
    <button onclick="addToCart('Watch', 1500)">Watch - ₹1500</button>

    <h3>🛒 Cart</h3>
    <ul id="cart"></ul>

    <h3>Total: ₹<span id="total">0</span></h3>

    <script src="script.js"></script>
</body>
</html>
